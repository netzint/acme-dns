services:
  acme-dns-with-ui:
    image: ghcr.io/netzint/acme-dns:combined
    container_name: acme-dns-with-ui
    restart: unless-stopped
    # The image runs as uid 1000. Both mounted directories have to be owned by
    # it: chown -R 1000:1000 config data
    user: "1000:1000"
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "80:80"      # HTTP API + UI
      - "443:443"    # HTTPS API + UI (if TLS enabled)
    volumes:
      - ./config:/etc/acme-dns:ro
      - ./data:/var/lib/acme-dns
    environment:
      - TZ=Europe/Berlin
    # With tls = "letsencrypt" the server only answers HTTPS and only presents a
    # certificate for its own domain, so the probe has to use that name.
    # Replace both occurrences with your own domain, or drop extra_hosts and use
    # http://localhost/health when running with tls = "none".
    extra_hosts:
      - "acme-dns.example.org:127.0.0.1"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "https://acme-dns.example.org/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"